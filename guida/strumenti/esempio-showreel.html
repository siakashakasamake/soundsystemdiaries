<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#000;color:#f3e2b0}

#wallwrap{position:absolute;inset:0;perspective:1400px;opacity:0;overflow:hidden}

.band.o{color:transparent;-webkit-text-stroke:3px rgba(243,226,176,.9)}
.band.f{color:#dc9605}

#tc{position:absolute;right:56px;top:96px;font-family:'Space Mono';font-weight:700;font-size:22px;letter-spacing:.2em;color:rgba(243,226,176,.75);opacity:0}
#tc i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#ff3b2f;margin-right:10px;vertical-align:middle}

#ttl{top:1130px;font-size:100px;letter-spacing:.02em}

#grain{position:absolute;inset:-60px;opacity:.16;mix-blend-mode:overlay;pointer-events:none}
